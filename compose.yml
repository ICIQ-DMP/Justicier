services:
  justicier:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      onedrive:
        condition: service_healthy
    volumes:
      - ./service/onedrive_data:/service/onedrive_data
    secrets:
      - VAULT_ADDR
      - VAULT_CACERT
      - VAULT_ROLE_ID
      - VAULT_SECRET_ID
      - vault.crt
    healthcheck:
      test: bash -c 'exec 3<>/dev/tcp/localhost/22'
      interval: 30s
      timeout: 5s
      retries: 3

  onedrive:
    image: docker.io/driveone/onedrive:edge
    container_name: onedrive
    userns_mode: keep-id
    volumes:
      - ./service/onedrive_conf:/onedrive/conf
      - ./service/onedrive_data:/onedrive/data
      - ./service/onedrive_logs:/onedrive/logs
    networks:
      - justicier_net
    healthcheck:
      test: sh -c '[ -s /onedrive/conf/items.sqlite3-wal ]'
      interval: 60s
      timeout: 5s
      retries: 2

secrets:
  VAULT_ADDR:
    file: ./secrets/VAULT_ADDR
  VAULT_CACERT:
    file: ./secrets/VAULT_CACERT
  VAULT_ROLE_ID:
    file: ./secrets/VAULT_ROLE_ID
  VAULT_SECRET_ID:
    file: ./secrets/VAULT_SECRET_ID
  vault.crt:
    file: ./secrets/vault.crt

networks:
  justicier_net:
    driver: bridge
