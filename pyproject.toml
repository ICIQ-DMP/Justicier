[project]
name = "justicier"
dynamic = ["version"]
description = "Automated salary justifications"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name="AleixMT"}]
license = {text="GPL-3.0-or-later"}
dependencies = [
    "pandas",
    "pandas-stubs",
    "openpyxl",
    "paramiko",
    "types-paramiko",
    "requests",
    "msal",
    "python-dotenv",
    "rich",
    "typer",
    "types-requests",
    "pypdf",
    "PyCryptodome",
    "Office365-REST-Python-Client",
    "pyfiglet",
    "pytz",
    "backports.zoneinfo; python_version < '3.9'",
]


[project.scripts]
justicier = "justicier.__main__:main"

[project.optional-dependencies]
dev = [
  "black",
  "pytest",
  "mypy",
  "pre-commit",
  "ruff"
]

[tool.semantic_release]
version_source = "tag"
commit_version_number = true
tag_format = "v{version}"

[tool.semantic_release.changelog]
mode = "update"

[tool.semantic_release.commit_parser_options]
allowed_tags = ["feat", "fix", "perf", "refactor", "docs", "style", "test", "chore", "build", "ci", "revert"]
minor_tags = ["feat"]
patch_tags = ["fix", "perf"]

[tool.black]
target-version = ["py311"]

[tool.ruff]
line-length = 120

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = "src"

[tool.mypy]
python_version = "3.11"
strict = true
